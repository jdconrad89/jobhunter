# Solid Queue recurring tasks (loaded by the scheduler process).
# See https://github.com/rails/solid_queue#recurring-tasks

development:
  schedule_job_searches:
    class: ScheduleJobSearchesJob
    queue: default
    schedule: every 15 minutes

production:
  schedule_job_searches:
    class: ScheduleJobSearchesJob
    queue: default
    schedule: every 15 minutes
